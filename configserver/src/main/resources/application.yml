spring:
  application:
    name: configserver
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/Azeemmobarak/securetrust-config.git"
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
        monitor:
          validation-filter-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8071

encrypt:
  key: "yT8vN2mK5qR1xL9bF4wH7sD0aP6eJ3uCkV8nM2zQ5gI="

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}